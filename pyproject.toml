[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bootdisk-ingest"
version = "1.0.0rc1"
description = "Source observations and preservation identities for historical software"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
bootdisk-ingest = "bootdisk_ingest.cli:main"

[tool.setuptools.packages.find]
include = ["bootdisk_ingest*"]

[tool.ruff]
line-length = 100
target-version = "py310"
